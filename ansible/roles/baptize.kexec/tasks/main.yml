- name: Get prereqs
  ansible.builtin.package:
    name:
      - bash
      - kexec-tools
    state: present
  when: ansible_facts["os_family"] != "NixOS"

- name: Pull kexec image
  ansible.builtin.get_url:
    url: "{{ item.url }}?v={{ '%s' | strftime }}"
    mode: "{{ item.mode | default('0600') }}"
    dest: "/{{ item.name }}"
    force: true
  loop:
    - name: kexec
      url: "{{ kexec_url }}"
      mode: "0700"
    - name: initrd.gz
      url: "{{ initrd_url }}"
    - name: bzImage
      url: "{{ bzimage_url }}"

- name: Cut kexec -e call from kexec wrapper
  ansible.builtin.replace:
    regexp: "^kexec -e.*"
    path: /kexec

- name: Set cmdline on kexec call
  ansible.builtin.replace:
    regexp: "{{ item.key }}"
    replace: "{{ item.key + item.val }}"
    path: /kexec
  loop:
    - key: "installer.image_url="
      val: "{{ image_url }}"
    - key: "installer.target_disk="
      val: "{{ target_disk }}"

- name: Drop page/inode/dentry caches
  ansible.builtin.shell:
    cmd: |-
      sync
      echo 3 > /proc/sys/vm/drop_caches
  changed_when: false
  failed_when: false

# todo: kill zram for kexec. it's pointless

# OOM (i.e. killed) is not changed, other errors are failed
- name: Load kexec params
  ansible.builtin.command:
    cmd: >-
      {% if ansible_facts["os_family"] == "NixOS" %}
      nix shell {{ pkgs_flake }}#kexec-tools -c
      {% endif %}
      /kexec
  register: kexec_load
  vars:
    kexec_oom: >-
      {{
        kexec_load.rc in [-9, 137] or
        'killed' in (kexec_load.module_stdout | default(kexec_load.stdout, true) | default('') | lower)
      }}
  changed_when: kexec_load.rc == 0
  failed_when:
    - kexec_load.rc != 0
    - not kexec_oom

- name: Recover from kexec load OOM
  when: kexec_load is not changed
  block:
    - name: Provision swap
      ansible.builtin.include_role:
        name: geerlingguy.swap
      vars:
        swap_file_path: /baptize.swap
        swap_file_size_mb: "{{ swap_size_mb }}"

    - name: Load kexec params (retry)
      ansible.builtin.command:
        cmd: >-
          {% if ansible_facts["os_family"] == "NixOS" %}
          nix shell {{ pkgs_flake }}#kexec-tools -c
          {% endif %}
          /kexec
      changed_when: true
      register: _out
      until: _out is not failed
      retries: 3

- name: Enter kexec
  ansible.builtin.command:
    cmd: 'kexec -e'
  changed_when: true
  async: 60
  poll: 0
