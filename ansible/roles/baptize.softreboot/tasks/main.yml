- name: Check systemd version
  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl --version
  register: systemctl_version
  changed_when: false

- name: Fail when systemd is too old
  ansible.builtin.fail:
    msg: >-
      systemd is too old for soft-reboot (need >= 254, got {{ ver }}).
      Set baptize_method=kexec to use kexec installer instead.
  when: ver is version('254', '<')
  vars:
    ver: >-
      {{ (systemctl_version.stdout_lines[0] | regex_replace('^systemd (.+) .*', '\1')) }}

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Assert systemd-soft-reboot.service is available
  ansible.builtin.fail:
    msg: systemd-soft-reboot.service is not available.
  when: ansible_facts.services['systemd-soft-reboot.service'] is not defined

- name: Stop swap
  when: ansible_facts["kernel"] | version('6.4', '<')
  block:
    - name: Stop swap units backed by the target disk
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
      loop: >-
        {{
          ansible_facts.services
          | dict2items
          | selectattr('key', 'match', '.*\.swap$')
          | selectattr('key', 'search', target_disk | basename)
          | map(attribute='key')
          | list
        }}
      failed_when: false

    - name: Swap off files backed by the target disk
      ansible.builtin.command:
        cmd: swapoff "{{ item }}"
      loop: "{{ ansible_facts['mounts'] | selectattr('fstype', 'equalto', 'swap') | map(attribute='device') | list }}"
      when: item is match('^' ~ target_disk ~ '(/|$)')
      changed_when: true
      failed_when: false

- name: Drop page/inode/dentry caches
  ansible.builtin.shell:
    cmd: |-
      sync
      echo 3 > /proc/sys/vm/drop_caches
  changed_when: false
  failed_when: false

- name: Clear possible previously mounted nextroot
  ansible.posix.mount:
    path: "{{ nextroot_dir }}"
    fstype: tmpfs
    src: fakesrc
    state: unmounted

- name: Mount a tmpfs to hold the nextroot
  ansible.posix.mount:
    path: "{{ nextroot_dir }}"
    fstype: tmpfs
    src: nextroot
    opts: >-
      size={{ nextroot_tmpfs_size }},mode=0755{{ noswap }}
    state: ephemeral
  vars:
    noswap: >-
      {% if ansible_facts["kernel"] is version('6.4', '>=') %},noswap{% endif %}

- name: Stream-extract the nextroot installer
  ansible.builtin.shell:
    # TODO: nix shell?
    cmd: |-
      set -o pipefail
      curl -fsSL "{{ nextroot_url }}?v={{ '%s' | strftime }}" \
        | zstd -d \
        | tar -x --numeric-owner -p -C {{ nextroot_dir }}
  changed_when: true

- name: Verify the nextroot is a valid os tree
  ansible.builtin.stat:
    path: "{{ nextroot_dir }}/{{ item }}"
  loop:
    - etc/os-release
    - sbin/init
  register: nextroot_check
  failed_when: >-
    (item == 'sbin/init' and not nextroot_check.stat.executable) or
    not nextroot_check.stat.exists

- name: Write installer parameters
  ansible.builtin.copy:
    dest: "{{ nextroot_dir }}/etc/installer.env"
    mode: "0600"
    content: |-
      IMAGE_URL={{ image_url }}
      TARGET_DISK={{ target_disk }}

- name: Check for host network configuration
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/network
    - /etc/resolv.conf
  register: host_net

- name: Ensure destination directories exist
  ansible.builtin.file:
    path: "{{ nextroot_dir }}{{ item.item | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ host_net.results }}"
  when: item.stat.exists

- name: Carry the host network configuration into the nextroot
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: "{{ nextroot_dir }}{{ item.item }}"
    remote_src: true
    mode: preserve
  loop: "{{ host_net.results }}"
  when: item.stat.exists

- name: Reboot into the nextroot
  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl soft-reboot
  changed_when: true
  ignore_unreachable: true
