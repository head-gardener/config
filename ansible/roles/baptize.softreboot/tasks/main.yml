- name: Assert systemd is new enough for soft-reboot
  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl --version
  register: systemctl_version
  changed_when: false

- name: Fail when systemd is too old
  ansible.builtin.fail:
    msg: >-
      systemd is too old for soft-reboot (need >= 254, got
      {{ systemctl_version.stdout_lines[0] | regex_replace('^systemd (.+) .*', '\\1') }}).
      Set -e baptize_method=kexec to use the legacy kexec installer instead.
  when: >-
    (systemctl_version.stdout_lines[0] | regex_replace('^systemd (.+) .*', '\1')) is version('254', '<')

- name: Assert soft-reboot.target is available
  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl show -p LoadState --value soft-reboot.target
  register: soft_reboot_loadstate
  changed_when: false
  failed_when: soft_reboot_loadstate.stdout == 'not-found'

- name: Stop memory-hungry services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ softreboot_stop_services }}"
  failed_when: false

- name: Disable swap files backed by the target disk
  ansible.builtin.command:
    cmd: swapoff "{{ item }}"
  loop: "{{ ansible_facts['mounts'] | selectattr('fstype', 'equalto', 'swap') | map(attribute='device') | list }}"
  when: item is match(target_disk ~ '.*')
  changed_when: true
  failed_when: false

- name: Drop page/inode/dentry caches
  ansible.builtin.shell:
    cmd: |-
      sync
      echo 3 > /proc/sys/vm/drop_caches
  changed_when: false
  failed_when: false

- name: Mount a tmpfs to hold the nextroot
  # noqa: args
  ansible.posix.mount:
    path: "{{ nextroot_dir }}"
    fstype: tmpfs
    opts: "size={{ nextroot_tmpfs_size }},mode=0755"
    state: ephemeral

- name: Stream-extract the nextroot installer
  ansible.builtin.shell:
    cmd: |-
      set -o pipefail
      curl -fsSL "{{ nextroot_url }}" | zstd -d | tar -x --numeric-owner -p -C {{ nextroot_dir }}
  register: nextroot_extract
  changed_when: nextroot_extract.rc == 0
  failed_when: nextroot_extract.rc != 0

- name: Verify the nextroot is a valid os tree
  ansible.builtin.stat:
    path: "{{ nextroot_dir }}/{{ item }}"
  loop:
    - etc/os-release
    - sbin/init
  register: nextroot_check
  failed_when: >-
    (item == 'sbin/init' and not nextroot_check.results[1].stat.executable) or
    not nextroot_check.results[0].stat.exists

- name: Write installer parameters
  ansible.builtin.copy:
    dest: "{{ nextroot_dir }}/etc/installer.env"
    mode: "0600"
    content: |-
      IMAGE_URL={{ image_url }}
      TARGET_DISK={{ target_disk }}

- name: Check for host network configuration
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/network
    - /etc/resolv.conf
  register: host_net

- name: Carry the host network configuration into the nextroot
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: "{{ nextroot_dir }}/{{ item.item }}"
    remote_src: true
    mode: preserve
  loop: "{{ host_net.results }}"
  when: item.stat.exists

- name: Reboot into the nextroot
  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl --job-mode=replace-irreversibly start soft-reboot.target
  changed_when: true
  async: 60
  poll: 0
